services:
  - type: web
    name: notion-cloud-drive
    env: node
    buildCommand: cd notion-drive-app && npm install && npm run build
    startCommand: cd notion-drive-app && npm start
    envVars:
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: DRIVE_PASSWORD
        sync: false
